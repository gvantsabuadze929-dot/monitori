<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>ტაბლო - მორბენალი სტრიქონი</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; overflow: hidden; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        
        .scroll-container { 
            height: calc(100vh - 160px); 
            overflow-y: auto; 
            scrollbar-width: none; 
            scroll-behavior: smooth; /* რბილი სქროლვისთვის */
        }
        
        .scroll-container::-webkit-scrollbar { display: none; }

        .live-match-box {
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.2) 0%, rgba(2, 6, 23, 1) 100%) !important;
            border-left: 15px solid #ef4444 !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.1);
        }

        .name-wrapper {
            flex: 1;
            overflow: hidden;
            height: 70px;
            display: flex;
            align-items: center;
            position: relative;
            min-width: 0;
        }

        .marquee-text {
            font-weight: 900;
            font-size: 2.8rem;
            line-height: 1;
            white-space: nowrap;
            display: inline-block;
            position: absolute;
            left: 0;
            will-change: transform;
        }

        .club-box {
            min-width: 85px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            color: #fff;
            font-weight: 900;
            font-size: 1.8rem;
            border-radius: 8px;
            border: 2px solid #334155;
            flex-shrink: 0;
            z-index: 10;
        }

        .live-text { color: #f87171 !important; }
    </style>
</head>
<body class="text-white h-screen flex flex-col">
    <header class="bg-slate-900 p-6 text-center border-b-4 border-slate-800 shadow-2xl relative z-20">
        <h1 class="text-4xl md:text-5xl font-black uppercase tracking-tight italic text-white">
            ძლიერი თაობა — ძლიერი საქართველო
        </h1>
    </header>

    <div class="flex flex-grow divide-x-4 divide-slate-800 overflow-hidden">
        <!-- ტატამი 1 -->
        <div class="w-1/2 flex flex-col overflow-hidden">
            <div class="bg-white p-3 text-center text-3xl font-black italic shadow-lg text-blue-700 border-b-2 border-blue-100">ტატამი 1</div>
            <div id="tatami-1-scroll" class="scroll-container p-4 space-y-6"></div>
        </div>
        <!-- ტატამი 2 -->
        <div class="w-1/2 flex flex-col overflow-hidden">
            <div class="bg-white p-3 text-center text-3xl font-black italic shadow-lg text-red-700 border-b-2 border-red-100">ტატამი 2</div>
            <div id="tatami-2-scroll" class="scroll-container p-4 space-y-6"></div>
        </div>
    </div>

    <script>
        // ── სახელების მორბენალი სტრიქონის პარამეტრები ──
        const SCROLL_SPEED = 60;   
        const PAUSE_START  = 1500; 
        const PAUSE_END    = 2000; 

        let cycleOrigin = null;
        let scrollPhaseDuration = 0;

        function computeScrollPhase() {
            let maxDist = 0;
            document.querySelectorAll('.marquee-text').forEach(el => {
                const wrapper = el.parentElement;
                if (!wrapper) return;
                const d = el.scrollWidth - wrapper.offsetWidth;
                if (d > maxDist) maxDist = d;
            });
            return maxDist > 5 ? (maxDist / SCROLL_SPEED) * 1000 : 0;
        }

        function globalTick(ts) {
            if (cycleOrigin === null) {
                cycleOrigin = ts;
                scrollPhaseDuration = computeScrollPhase();
            }

            const total   = PAUSE_START + scrollPhaseDuration + PAUSE_END;
            const elapsed = total > 0 ? (ts - cycleOrigin) % total : 0;

            if (ts - cycleOrigin >= total) {
                cycleOrigin = ts - (elapsed);
                scrollPhaseDuration = computeScrollPhase();
            }

            document.querySelectorAll('.marquee-text').forEach(el => {
                const wrapper = el.parentElement;
                if (!wrapper) return;
                const dist = el.scrollWidth - wrapper.offsetWidth;

                if (dist <= 5) {
                    el.style.transform = 'translateX(0)';
                    return;
                }

                if (elapsed < PAUSE_START) {
                    el.style.transform = 'translateX(0)';
                } else if (elapsed < PAUSE_START + scrollPhaseDuration) {
                    const scrollElapsed = elapsed - PAUSE_START;
                    const elDuration = (dist / SCROLL_SPEED) * 1000;
                    const progress = Math.min(scrollElapsed / elDuration, 1);
                    el.style.transform = `translateX(${-dist * progress}px)`;
                } else {
                    el.style.transform = `translateX(${-dist}px)`;
                }
            });

            requestAnimationFrame(globalTick);
        }

        requestAnimationFrame(globalTick);

        function createMatchHTML(m, isLive) {
            const dimClass = m.completed ? 'opacity-10 grayscale scale-95' : '';
            const liveClass = isLive ? 'live-match-box' : '';
            const textClass = isLive ? 'live-text' : 'text-slate-100';
            
            return `
                <div id="match-${m.id}" class="bg-slate-900/80 rounded-2xl border border-slate-800 overflow-hidden transition-all duration-500 ${dimClass} ${liveClass}">
                    <div class="flex items-center justify-between h-24 px-4 gap-4">
                        <div class="flex flex-1 items-center min-w-0 gap-3">
                            <div class="club-box">${m.c1}</div>
                            <div class="name-wrapper">
                                <span class="marquee-text ${textClass}">${m.p1}</span>
                            </div>
                        </div>
                        <div class="flex flex-col items-center flex-shrink-0">
                            <span class="text-xl font-black text-slate-700 italic">VS</span>
                            ${isLive ? '<span class="bg-red-600 text-[10px] px-2 py-0.5 rounded font-black animate-pulse mt-1">LIVE</span>' : ''}
                        </div>
                        <div class="flex flex-1 items-center flex-row-reverse min-w-0 gap-3">
                            <div class="club-box">${m.c2}</div>
                            <div class="name-wrapper">
                                <span class="marquee-text ${textClass}">${m.p2}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function updateDisplay() {
            const matches = JSON.parse(localStorage.getItem('karate_db_v5') || '[]');
            
            for (let t = 1; t <= 2; t++) {
                const container = document.getElementById(`tatami-${t}-scroll`);
                const list = matches.filter(m => m.tatami == t);
                
                // ვპოულობთ LIVE ბრძოლას
                const liveIdx = list.findIndex(m => !m.completed);
                const html = list.map((m, i) => createMatchHTML(m, i === liveIdx)).join('');
                
                if (container.innerHTML !== html) {
                    container.innerHTML = html;
                    
                    // ავტომატური სქროლვა LIVE ბრძოლაზე
                    setTimeout(() => {
                        const liveMatch = container.querySelector('.live-match-box');
                        if (liveMatch) {
                            liveMatch.scrollIntoView({ 
                                behavior: 'smooth', 
                                block: 'start' 
                            });
                        }
                    }, 300);
                }
            }
        }

        window.addEventListener('storage', updateDisplay);
        setInterval(updateDisplay, 3000);
        updateDisplay();
    </script>
</body>
</html>
