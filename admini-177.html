<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>ადმინ პანელი - კარატე</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; }
        .completed-row { opacity: 0.4; background-color: #f8fafc; }
        #edit-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:50; align-items:center; justify-content:center; }
        #edit-modal.open { display:flex; }
        .highlight { background: #fef08a; border-radius: 2px; }
        .tatami-scroll-body { max-height: 420px; overflow-y: auto; display: block; scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }
        .tatami-scroll-body::-webkit-scrollbar { width: 6px; }
        .tatami-scroll-body::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 3px; }
        .tatami-scroll-body::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .tatami-scroll-body::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* drag & drop */
        tr[draggable] { cursor: grab; }
        tr[draggable]:active { cursor: grabbing; }
        tr.dragging { opacity: 0.25; background: #cbd5e1 !important; outline: 2px dashed #94a3b8; }
        tr.drag-over-top { box-shadow: inset 0 4px 0 0 #2563eb; background: #eff6ff !important; }
        tr.drag-over-bottom { box-shadow: inset 0 -4px 0 0 #2563eb; background: #eff6ff !important; }
        tr[draggable] { transition: background 1.5s ease; }
        tr.drop-flash { background: #bfdbfe !important; transition: none; }
        .drag-handle { cursor: grab; color: #94a3b8; padding: 0 6px; font-size: 1rem; user-select: none; line-height:1; }
        .drag-handle:hover { color: #475569; }
        .winner-dropdown { position:relative; display:inline-block; }
        .winner-menu { display:none; position:absolute; right:0; top:100%; z-index:100; background:#fff; border:2px solid #fbbf24; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.15); min-width:160px; overflow:hidden; }
        .winner-menu.open { display:block; }
        .winner-menu button { display:block; width:100%; text-align:left; padding:8px 12px; font-size:11px; font-weight:800; border:none; background:none; cursor:pointer; transition:background 0.20s; }
        .winner-menu button:hover { background:#fef9c3; }
        .winner-menu .clear-winner { color:#94a3b8; border-top:1px solid #f1f5f9; }
        .winner-set { background:#fef08a !important; }

        /* Password overlay */
        #password-overlay { position:fixed; inset:0; background:#0f172a; z-index:9999; display:flex; align-items:center; justify-content:center; }
        #pw-input:focus { border-color: #3b82f6; }

        /* Live badge animation */
        @keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .live-badge { animation: livePulse 1.2s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-100 p-4">

<!-- პაროლის ეკრანი -->
<div id="password-overlay">
    <div style="background:#fff; border-radius:20px; box-shadow:0 25px 60px rgba(0,0,0,0.4); padding:40px 32px; width:100%; max-width:360px; margin:16px; text-align:center;">
        <div style="font-size:3rem; margin-bottom:12px;">🥋</div>
        <h2 style="font-size:1.3rem; font-weight:900; color:#1e293b; margin-bottom:6px;">ადმინ პანელი</h2>
        <p style="font-size:0.85rem; color:#94a3b8; margin-bottom:20px;">შეიყვანეთ პაროლი გასაგრძელებლად</p>
        <input type="password" id="pw-input" placeholder="••••••••" autocomplete="off"
            style="width:100%; border:2px solid #e2e8f0; padding:12px; border-radius:10px; text-align:center; font-size:1.2rem; letter-spacing:0.2em; outline:none; box-sizing:border-box; margin-bottom:12px;"
            onkeydown="if(event.key==='Enter')checkPw()">
        <button onclick="checkPw()"
            style="width:100%; background:#0f172a; color:#fff; font-weight:900; padding:12px; border-radius:10px; border:none; font-size:1rem; cursor:pointer; transition:background 0.2s;"
            onmouseover="this.style.background='#1e293b'" onmouseout="this.style.background='#0f172a'">
            შესვლა →
        </button>
        <p id="pw-error" style="color:#ef4444; font-size:0.78rem; font-weight:700; margin-top:12px; height:18px;"></p>
    </div>
</div>

<!-- რედაქტირების მოდალი -->

<div class="max-w-7xl mx-auto">

    <div class="flex flex-wrap justify-between items-center gap-3 mb-6">

        <div class="flex items-center gap-3 flex-wrap">
            <div class="relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
                <input type="text" id="search-input" placeholder="მებრძოლის ძებნა..." oninput="render()" class="pl-8 pr-4 py-2 border-2 border-slate-200 rounded-lg text-sm focus:border-blue-500 outline-none w-56">

    <!-- სათაურის რედაქტირება -->

        <div class="flex flex-wrap items-end gap-3">
            <div class="flex-1 min-w-[180px] space-y-1">

    <!-- სტატისტიკა: ონლაინი + სულ ნანახი -->

            <div>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-0.5">ამჟამად მონიტორზე</p>
                <div class="flex items-center gap-2">
                    <span id="stat-online" class="text-3xl font-black text-emerald-600">—</span>
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>

        </div>
        <div class="bg-white rounded-2xl shadow-xl border-b-4 border-blue-400 p-5 flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-blue-100 flex items-center justify-center text-2xl flex-shrink-0">📊</div>
            <div>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-0.5">სულ ნახვა</p>
                <span id="stat-total" class="text-3xl font-black text-blue-600">—</span>
                <p class="text-[10px] text-slate-400 mt-0.5">უნიკალური სესია</p>
            </div>
        </div>
    </div>

    <!-- ფორმა -->
    <div class="bg-white p-6 rounded-2xl shadow-xl mb-8 border-b-4 border-slate-300">
        <form id="match-form" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                <div class="col-span-2 space-y-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">მებრძოლი 1 და კლუბი</label>
                    <div class="flex gap-2">
                        <input type="text" id="p1" placeholder="სახელი გვარი" class="w-full border-2 border-slate-100 p-2.5 rounded-lg focus:border-blue-500 outline-none transition-all" required>
                        <input type="text" id="c1" placeholder="კლუბი" class="w-24 border-2 border-slate-100 p-2.5 rounded-lg text-center font-bold focus:border-blue-500 outline-none" required>
                    </div>
                </div>
                <div class="flex justify-center pb-3">
                    <span class="bg-slate-100 text-slate-400 px-3 py-1 rounded-full text-xs font-black">VS</span>
                </div>
                <div class="col-span-2 space-y-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">მებრძოლი 2 და კლუბი</label>
                    <div class="flex gap-2">
                        <input type="text" id="p2" placeholder="სახელი გვარი" class="w-full border-2 border-slate-100 p-2.5 rounded-lg focus:border-blue-500 outline-none transition-all" required>
                        <input type="text" id="c2" placeholder="კლუბი" class="w-24 border-2 border-slate-100 p-2.5 rounded-lg text-center font-bold focus:border-blue-500 outline-none" required>

            <div class="flex gap-4 pt-2">
                <select id="tatami" class="w-52 border-2 border-slate-100 p-3 rounded-lg font-black text-blue-600 bg-slate-50 cursor-pointer">

                    <option value="2">🔴 ტატამი 2</option>

            </div>
        </form>
    </div>

    <!-- ტატამი პანელები (დინამიური) -->
    <div id="tatami-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-6"></div>

</div>

<script>
    // ======= პაროლი — აქ შეცვალეთ =======
    const ADMIN_PASSWORD = "admin2025";
    // =====================================

    function checkPw() {
        const val = document.getElementById('pw-input').value;
        if (val === ADMIN_PASSWORD) {
            document.getElementById('password-overlay').style.display = 'none';
            localStorage.setItem('admin-auth', Date.now());
        } else {
            const err = document.getElementById('pw-error');
            err.textContent = '❌ პაროლი არასწორია. სცადეთ თავიდან.';
            document.getElementById('pw-input').value = '';
            document.getElementById('pw-input').focus();
            document.getElementById('pw-input').style.borderColor = '#ef4444';
            setTimeout(() => {
                err.textContent = '';
                document.getElementById('pw-input').style.borderColor = '#e2e8f0';
            }, 2500);
        }
    }

    // 24 საათის შემოწმება
    const savedAuth = localStorage.getItem('admin-auth');
    if (savedAuth && (Date.now() - Number(savedAuth)) < 24 * 60 * 60 * 1000) {
        document.getElementById('password-overlay').style.display = 'none';
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, increment, runTransaction, onDisconnect, serverTimestamp, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDSaW1w_ETXCTBFd5f3Vi4qMM_CXxZGzXQ",
        authDomain: "gvantsa-d81b8.firebaseapp.com",
        databaseURL: "https://gvantsa-d81b8-default-rtdb.firebaseio.com",
        projectId: "gvantsa-d81b8",
        storageBucket: "gvantsa-d81b8.firebasestorage.app",
        messagingSenderId: "317477171856",
        appId: "1:317477171856:web:f28aff3d09855350739e15",
        measurementId: "G-R107GL7H2C"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const matchesRef = ref(db, 'matches');
    const settingsRef = ref(db, 'settings');
    let matches = [];
    let currentSettings = {};
    const statusEl = document.getElementById('sync-status');

    // ===== სტატისტიკა: ონლაინ მომხმარებლები + სულ ნახვები =====
    // ადმინი მხოლოდ კითხულობს — presence-ს ადმინი არ ქმნის
    const presenceRoot = ref(db, 'presence');
    const totalViewsRef = ref(db, 'analytics/totalViews');

    // ონლაინ მომხმარებლების რაოდენობა (real-time)
    onValue(presenceRoot, (snap) => {
        const val = snap.val();
        const count = val ? Object.keys(val).length : 0;
        const el = document.getElementById('stat-online');
        if (el) el.textContent = count;
    });

    // სულ ნახვა
    onValue(totalViewsRef, (snap) => {
        const val = snap.val() || 0;
        const el = document.getElementById('stat-total');
        if (el) el.textContent = val.toLocaleString();
    });

    const TATAMI_COLORS = [
        { border:'border-blue-500',   bg:'bg-blue-50',   hdr:'text-blue-700',   badge:'bg-blue-200 text-blue-700',   icon:'🔵' },
        { border:'border-red-500',    bg:'bg-red-50',    hdr:'text-red-700',    badge:'bg-red-200 text-red-700',     icon:'🔴' },
        { border:'border-green-500',  bg:'bg-green-50',  hdr:'text-green-700',  badge:'bg-green-200 text-green-700', icon:'🟢' },
        { border:'border-yellow-400', bg:'bg-yellow-50', hdr:'text-yellow-700', badge:'bg-yellow-200 text-yellow-700',icon:'🟡' },
        { border:'border-purple-500', bg:'bg-purple-50', hdr:'text-purple-700', badge:'bg-purple-200 text-purple-700',icon:'🟣' },
        { border:'border-pink-500',   bg:'bg-pink-50',   hdr:'text-pink-700',   badge:'bg-pink-200 text-pink-700',   icon:'🩷' },
    ];

    let activeTatamiCount = 4;

    function buildTatamiPanels(count) {
        activeTatamiCount = count;
        const grid = document.getElementById('tatami-grid');
        grid.innerHTML = '';
        for (let t = 1; t <= count; t++) {
            const c = TATAMI_COLORS[t - 1];
            const div = document.createElement('div');
            div.className = `bg-white rounded-2xl shadow-lg border-t-8 ${c.border} overflow-hidden`;
            div.innerHTML = `
                <div class="${c.bg} p-4 border-b border-opacity-20 flex justify-between items-center gap-2">
                    <h2 class="font-black ${c.hdr} uppercase text-lg">${c.icon} ტატამი ${t}</h2>
                    <div class="flex items-center gap-2">
                        <label title="Excel/CSV-დან შეტვირთვა" class="cursor-pointer bg-emerald-100 text-emerald-700 px-2 py-1 rounded-lg text-xs font-black hover:bg-emerald-200 transition-all flex items-center gap-1">
                            📂 Excel
                            <input type="file" accept=".xlsx,.xls,.csv" class="hidden" onchange="importExcel(event, ${t})">
                        </label>
                        <span id="count-${t}" class="${c.badge} text-xs px-2 py-1 rounded-md font-bold">0</span>
                    </div>
                </div>
                <div class="px-3 py-2 border-b border-slate-100 flex items-center gap-2 bg-slate-50">
                    <label class="flex items-center gap-1 cursor-pointer" title="მონიტორზე ჩვენება">
                        <input type="checkbox" id="link-enabled-${t}" onchange="saveLink(${t})"
                            class="w-3.5 h-3.5 accent-red-500 cursor-pointer">
                        <span class="text-slate-400 text-xs">▶</span>
                    </label>
                    <input type="url" id="link-input-${t}" placeholder="YouTube / Stream ლინკი..."
                        class="flex-1 text-xs border border-slate-200 px-2 py-1.5 rounded-lg focus:outline-none focus:border-blue-400 bg-white">
                    <button onclick="saveLink(${t})" class="text-xs bg-red-100 text-red-600 px-2 py-1.5 rounded-lg font-black hover:bg-red-200 transition-all whitespace-nowrap">💾 შენახვა</button>
                </div>
                <div class="tatami-scroll-body"><table class="w-full text-sm"><tbody id="admin-list-${t}" class="divide-y divide-slate-100"></tbody></table></div>
            `;
            grid.appendChild(div);
        }
        // update tatami selects
        const opts = Array.from({length: count}, (_,i) => {
            const c = TATAMI_COLORS[i];
            return `<option value="${i+1}">${c.icon} ტატამი ${i+1}</option>`;
        }).join('');
        document.getElementById('tatami').innerHTML = opts;
        document.getElementById('edit-tatami').innerHTML = opts;
        render();
    }

    // სათაურის ჩატვირთვა Firebase-დან
    onValue(settingsRef, (snap) => {
        currentSettings = snap.val() || {};
        if (currentSettings.subtitle !== undefined) document.getElementById('title-sub').value = currentSettings.subtitle;
        if (currentSettings.title !== undefined) document.getElementById('title-main').value = currentSettings.title;
        const cnt = parseInt(currentSettings.tatamiCount) || 4;
        document.getElementById('tatami-count-select').value = cnt;
        buildTatamiPanels(cnt);
        // ლინკების ჩატვირთვა
        for (let t = 1; t <= cnt; t++) {
            const inp = document.getElementById(`link-input-${t}`);
            const chk = document.getElementById(`link-enabled-${t}`);
            const val = currentSettings.tatamiLinks && currentSettings.tatamiLinks[String(t)];
            if (inp) inp.value = (val && val.link) ? val.link : (typeof val === 'string' ? val : '');
            if (chk) chk.checked = val ? (val.enabled !== undefined ? val.enabled : !!val) : false;
        }
    });

    window.saveTitle = async () => {
        const subtitle = document.getElementById('title-sub').value.trim();
        const title = document.getElementById('title-main').value.trim();
        const tatamiCount = parseInt(document.getElementById('tatami-count-select').value);
        const statusMsg = document.getElementById('title-save-status');
        try {
            currentSettings = { ...currentSettings, subtitle, title, tatamiCount };
            await set(settingsRef, currentSettings);
            statusMsg.textContent = '✅ შენახულია!';
            statusMsg.className = 'text-xs text-emerald-600 mt-2 ml-1 h-4 font-bold';
        } catch (err) {
            statusMsg.textContent = '❌ შეცდომა შენახვისას';
            statusMsg.className = 'text-xs text-red-500 mt-2 ml-1 h-4 font-bold';
        }
        setTimeout(() => { statusMsg.textContent = ''; }, 3000);
    };

    window.saveLink = async (t) => {
        const link = document.getElementById(`link-input-${t}`)?.value.trim() || '';
        const enabled = document.getElementById(`link-enabled-${t}`)?.checked || false;
        currentSettings.tatamiLinks = currentSettings.tatamiLinks || {};
        currentSettings.tatamiLinks[String(t)] = { link, enabled };
        await set(settingsRef, currentSettings);
        const btn = document.querySelector(`[onclick="saveLink(${t})"]`);
        if (btn) { const orig = btn.textContent; btn.textContent = '✅'; setTimeout(() => btn.textContent = orig, 1500); }
    };

    onValue(matchesRef, (snapshot) => {
        const data = snapshot.val();
        matches = data ? Object.values(data).sort((a, b) => (a.order||0) - (b.order||0) || a.id - b.id) : [];
        statusEl.textContent = '🟢 სინქრონიზებულია';
        statusEl.className = 'text-xs font-bold text-emerald-600';
        render();
    }, () => {
        statusEl.textContent = '🔴 კავშირი წყდება';
        statusEl.className = 'text-xs font-bold text-red-500';
    });

    async function saveToFirebase() {
        const obj = {};
        matches.forEach(m => { obj[m.id] = m; });
        await set(matchesRef, obj);
    }

    window.importExcel = async (event, tatami) => {
        const file = event.target.files[0];
        if (!file) return;
        event.target.value = ''; // reset so same file can be re-imported

        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const wb = XLSX.read(e.target.result, { type: 'array' });
                const ws = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

                if (rows.length === 0) { alert('ცხრილი ცარიელია!'); return; }

                // detect columns — support Georgian or English headers
                const sample = rows[0];
                const keys = Object.keys(sample);

                function findCol(...candidates) {
                    for (const c of candidates) {
                        const found = keys.find(k => k.toLowerCase().replace(/\s/g,'').includes(c.toLowerCase().replace(/\s/g,'')));
                        if (found) return found;
                    }
                    return null;
                }

                const colP1 = findCol('მებრძოლი1','მებრძოლი 1','fighter1','player1','p1','სახელი1','name1','მოჭიდავე1');
                const colC1 = findCol('კლუბი1','კლუბი 1','club1','c1','გუნდი1','team1');
                const colP2 = findCol('მებრძოლი2','მებრძოლი 2','fighter2','player2','p2','სახელი2','name2','მოჭიდავე2');
                const colC2 = findCol('კლუბი2','კლუბი 2','club2','c2','გუნდი2','team2');

                // fallback: use positional columns (0,1,2,3)
                const p1k = colP1 || keys[0];
                const c1k = colC1 || keys[1];
                const p2k = colP2 || keys[2];
                const c2k = colC2 || keys[3];

                if (!p1k || !p2k) { alert('სვეტები ვერ მოიძებნა. გთხოვთ გქონდეთ: მებრძოლი 1, კლუბი 1, მებრძოლი 2, კლუბი 2'); return; }

                const tatamiMatches = matches.filter(m => m.tatami == tatami);
                let maxOrder = tatamiMatches.length > 0 ? Math.max(...tatamiMatches.map(m => m.order||0)) : 0;

                let added = 0;
                for (const row of rows) {
                    const p1 = String(row[p1k] || '').trim();
                    const p2 = String(row[p2k] || '').trim();
                    if (!p1 || !p2) continue;
                    matches.push({
                        id: Date.now() + added,
                        order: ++maxOrder,
                        p1, c1: String(row[c1k] || '').trim(),
                        p2, c2: String(row[c2k] || '').trim(),
                        tatami: String(tatami),
                        completed: false
                    });
                    added++;
                }

                if (added === 0) { alert('შესატანი სტრიქონი ვერ მოიძებნა.'); return; }
                await saveToFirebase();
                alert(`✅ ${added} წყვილი დაემატა ტატამი ${tatami}-ს!`);
            } catch (err) {
                alert('❌ ფაილის წაკითხვა ვერ მოხერხდა: ' + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    };

    document.getElementById('match-form').onsubmit = async (e) => {
        e.preventDefault();
        const tatami = document.getElementById('tatami').value;
        const tatamiMatches = matches.filter(m => m.tatami == tatami);
        const maxOrder = tatamiMatches.length > 0 ? Math.max(...tatamiMatches.map(m => m.order||0)) : 0;
        matches.push({
            id: Date.now(), order: maxOrder + 1,
            p1: document.getElementById('p1').value, c1: document.getElementById('c1').value,
            p2: document.getElementById('p2').value, c2: document.getElementById('c2').value,
            tatami, completed: false
        });
        e.target.reset();
        await saveToFirebase();
    };

    window.toggle = async (id) => {
        id = Number(id);
        const m = matches.find(x => Number(x.id) === id);
        if (m) { m.completed = !m.completed; await saveToFirebase(); }
    };

    window.remove = async (id) => {
        id = Number(id);
        if (confirm('წავშალოთ ჩანაწერი?')) {
            matches = matches.filter(x => Number(x.id) !== id);
            await saveToFirebase();
        }
    };

    window.moveUp = async (id) => {
        const m = matches.find(x => x.id === id);
        if (!m) return;
        const list = matches.filter(x => x.tatami === m.tatami).sort((a,b) => (a.order||0)-(b.order||0));
        const idx = list.findIndex(x => x.id === id);
        if (idx <= 0) return;
        const tmp = m.order; m.order = list[idx-1].order; list[idx-1].order = tmp;
        await saveToFirebase();
    };

    window.moveDown = async (id) => {
        const m = matches.find(x => x.id === id);
        if (!m) return;
        const list = matches.filter(x => x.tatami === m.tatami).sort((a,b) => (a.order||0)-(b.order||0));
        const idx = list.findIndex(x => x.id === id);
        if (idx >= list.length - 1) return;
        const tmp = m.order; m.order = list[idx+1].order; list[idx+1].order = tmp;
        await saveToFirebase();
    };

    window.openEdit = (id) => {
        id = Number(id);
        const m = matches.find(x => Number(x.id) === id);
        if (!m) return;
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-p1').value = m.p1;
        document.getElementById('edit-c1').value = m.c1;
        document.getElementById('edit-p2').value = m.p2;
        document.getElementById('edit-c2').value = m.c2;
        document.getElementById('edit-tatami').value = m.tatami;
        document.getElementById('edit-modal').classList.add('open');
    };

    window.closeModal = () => document.getElementById('edit-modal').classList.remove('open');

    window.saveEdit = async () => {
        const id = Number(document.getElementById('edit-id').value);
        const m = matches.find(x => Number(x.id) === id);
        if (!m) return;
        m.p1 = document.getElementById('edit-p1').value;
        m.c1 = document.getElementById('edit-c1').value;
        m.p2 = document.getElementById('edit-p2').value;
        m.c2 = document.getElementById('edit-c2').value;
        m.tatami = document.getElementById('edit-tatami').value;
        closeModal();
        await saveToFirebase();
    };

    window.clearAll = async () => {
        if (confirm('გსურთ მთლიანი ბაზის წაშლა?')) {
            matches = [];
            await set(matchesRef, null);
        }
    };

    function highlight(text, q) {
        if (!q) return text;
        const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
        return text.replace(re, '<mark class="highlight">$1</mark>');
    }

    window.render = function() {
        const q = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
        for (let t = 1; t <= activeTatamiCount; t++) {
            const listEl = document.getElementById(`admin-list-${t}`);
            const countBadge = document.getElementById(`count-${t}`);
            if (!listEl || !countBadge) continue;
            const tatamiMatches = matches
                .filter(m => m.tatami == t)
                .sort((a, b) => (a.order||0) - (b.order||0));
            const filtered = q
                ? tatamiMatches.filter(m =>
                    m.p1.toLowerCase().includes(q) || m.p2.toLowerCase().includes(q) ||
                    m.c1.toLowerCase().includes(q) || m.c2.toLowerCase().includes(q))
                : tatamiMatches;
            countBadge.innerText = tatamiMatches.length;

            if (filtered.length === 0) {
                listEl.innerHTML = `<tr><td colspan="3" class="text-center text-slate-400 text-xs py-6">${q ? 'ვერ მოიძებნა' : 'სია ცარიელია'}</td></tr>`;
                continue;
            }

            // პირველი არდასრულებული ბრძოლის ID
            const firstActiveId = tatamiMatches.find(m => !m.completed)?.id;

            listEl.innerHTML = filtered.map((m) => {
                const isFirst = m.id === firstActiveId;
                const isLive = !!m.live;
                return `
                <tr draggable="true" data-id="${m.id}" class="hover:bg-slate-50 transition-colors ${m.completed ? 'completed-row' : ''} ${isLive ? 'bg-emerald-50' : ''}">
                    <td class="pl-2 py-3 w-6">
                        <span class="drag-handle" title="გადაათრიე">⠿</span>
                    </td>
                    <td class="pl-1 pr-1 py-3 font-bold text-slate-400 text-xs w-7">
                        ${isLive ? `<span class="live-badge text-red-500 font-black text-[9px] block text-center leading-tight">🔴<br>LIVE</span>` : `#${tatamiMatches.indexOf(m)+1}`}
                    </td>
                    <td class="py-3 px-2">
                        <div class="font-bold text-slate-800 text-sm">${highlight(m.p1, q)} <span class="text-blue-500 text-xs">[${highlight(m.c1, q)}]</span></div>
                        <div class="text-[10px] text-slate-400 font-bold my-0.5">VS</div>
                        <div class="font-bold text-slate-800 text-sm">${highlight(m.p2, q)} <span class="text-blue-500 text-xs">[${highlight(m.c2, q)}]</span></div>
                    </td>
                    <td class="py-3 pr-2">
                        <div class="flex flex-col items-end gap-1">
                            ${isFirst && !isLive ? `<button onclick="markStarted(${m.id})" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black px-3 py-1.5 rounded-lg text-[11px] transition-all active:scale-95 mb-1">▶ დაწყება</button>` : ''}
                            ${isLive ? `<button onclick="markStarted(${m.id})" class="w-full bg-red-500 hover:bg-red-600 text-white font-black px-3 py-1.5 rounded-lg text-[11px] transition-all active:scale-95 mb-1">⏹ დასრულება</button>` : ''}
                            <div class="flex gap-1">
                                <button onclick="openEdit(${m.id})" class="bg-blue-100 text-blue-600 px-2 py-1 rounded text-[10px] font-black hover:bg-blue-200">✏️</button>
                                <button onclick="toggle(${m.id})" class="px-2 py-1 rounded text-[10px] font-black ${m.completed ? 'bg-orange-100 text-orange-600' : 'bg-emerald-100 text-emerald-700'}">
                                    ${m.completed ? '↩' : '✓'}
                                </button>
                                <div class="winner-dropdown">
                                    <button onclick="toggleWinnerMenu(event,${m.id})" class="px-2 py-1 rounded text-[10px] font-black ${m.winner ? 'bg-yellow-200 text-yellow-700 winner-set' : 'bg-slate-100 text-slate-500'} hover:bg-yellow-100">🏆</button>
                                    <div class="winner-menu" id="winner-menu-${m.id}">
                                        <button onclick="setWinner(${m.id},1)">🥇 ${m.p1} <span class="text-slate-400">[${m.c1}]</span></button>
                                        <button onclick="setWinner(${m.id},2)">🥇 ${m.p2} <span class="text-slate-400">[${m.c2}]</span></button>
                                        <button class="clear-winner" onclick="setWinner(${m.id},0)">✖ გაუქმება</button>
                                    </div>
                                </div>
                                <button onclick="remove(${m.id})" class="bg-slate-100 text-slate-400 px-2 py-1 rounded text-[10px] hover:text-red-500">✖</button>
                            </div>
                            ${m.winner ? `<div class="text-[9px] font-black text-yellow-600 text-right">🏆 ${m.winner === 1 ? m.p1 : m.p2}</div>` : ''}
                        </div>
                    </td>
                </tr>
            `}).join('');

            initDragDrop(listEl, t);
        }
    }

    window.toggleWinnerMenu = (e, id) => {
        e.stopPropagation();
        document.querySelectorAll('.winner-menu').forEach(m => {
            if (m.id !== `winner-menu-${id}`) m.classList.remove('open');
        });
        document.getElementById(`winner-menu-${id}`)?.classList.toggle('open');
    };
    document.addEventListener('click', () => {
        document.querySelectorAll('.winner-menu').forEach(m => m.classList.remove('open'));
    });

    window.markStarted = async (id) => {
        id = Number(id);
        const m = matches.find(x => Number(x.id) === id);
        if (!m) return;
        if (m.live) {
            // "დასრულება" — live გამორთვა + completed
            m.live = false;
            m.completed = true;
        } else {
            // "დაწყება" — live ჩართვა
            m.live = true;
        }
        await saveToFirebase();
    };

    window.setWinner = async (id, which) => {
        id = Number(id);
        const m = matches.find(x => Number(x.id) === id);
        if (!m) return;
        m.winner = which || null;
        if (which) {
            // გამარჯვებული დაყენდა → ბრძოლა დამთავრებულია, live გამოირთვება
            m.completed = true;
            m.live = false;
        } else {
            // გამარჯვებული გაუქმდა → completed-იც გაუქმდეს
            m.completed = false;
        }
        document.querySelectorAll('.winner-menu').forEach(x => x.classList.remove('open'));
        await saveToFirebase();
    };

    let dragSrcId = null;

    function initDragDrop(tbody, tatami) {
        tbody.querySelectorAll('tr[draggable]').forEach(row => {
            row.addEventListener('dragstart', e => {
                dragSrcId = Number(row.dataset.id);
                e.dataTransfer.effectAllowed = 'move';
                setTimeout(() => row.classList.add('dragging'), 0);
            });

            row.addEventListener('dragend', () => {
                row.classList.remove('dragging');
                tbody.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over-top','drag-over-bottom'));
            });

            row.addEventListener('dragover', e => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                tbody.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over-top','drag-over-bottom'));
                const rect = row.getBoundingClientRect();
                const mid = rect.top + rect.height / 2;
                row.classList.add(e.clientY < mid ? 'drag-over-top' : 'drag-over-bottom');
            });

            row.addEventListener('dragleave', () => {
                row.classList.remove('drag-over-top','drag-over-bottom');
            });

            row.addEventListener('drop', async e => {
                e.preventDefault();
                row.classList.remove('drag-over-top','drag-over-bottom');
                const targetId = Number(row.dataset.id);
                if (dragSrcId === targetId) return;

                const rect = row.getBoundingClientRect();
                const mid = rect.top + rect.height / 2;
                const insertBefore = e.clientY < mid;

                const list = matches
                    .filter(m => m.tatami == tatami)
                    .sort((a, b) => (a.order||0) - (b.order||0));

                const src = list.find(m => Number(m.id) === dragSrcId);
                const target = list.find(m => Number(m.id) === targetId);
                if (!src || !target) return;

                // remove src from list, insert relative to target
                const without = list.filter(m => m.id !== dragSrcId);
                const tIdx = without.findIndex(m => m.id === targetId);
                const insertIdx = insertBefore ? tIdx : tIdx + 1;
                without.splice(insertIdx, 0, src);

                // reassign order values
                without.forEach((m, i) => { m.order = i + 1; });
                await saveToFirebase();

                // flash the dropped row: instant blue, then fade back
                setTimeout(() => {
                    const dropped = tbody.querySelector(`tr[data-id="${dragSrcId}"]`);
                    if (dropped) {
                        dropped.classList.add('drop-flash');
                        requestAnimationFrame(() => requestAnimationFrame(() => {
                            dropped.classList.remove('drop-flash');
                        }));
                    }
                }, 80);
            });
        });
    }
</script>
</body>
</html>
